name: Build and publish Quarto website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render website
        run: quarto render
      - name: Check pages and CV
        run: |
          test -f _site/index.html
          test -f _site/cv.html
          test -f _site/assets/cv.pdf
          test -f _site/assets/portrait.jpg
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
